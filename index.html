<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleccionar clase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Clase</h1>
      </header>

      <h2>Seleccionar clase</h2>

      <form action="horario.html" method="get">
        <div>
          <label for="clase">Clase:</label>
          <select name="clase" id="clase" required>
            <option value="" hidden>Seleccionar Clase...</option>
            <option value="1A">1º A</option>
            <option value="1B">1º B</option>
            <option value="2A">2º A</option>
            <option value="2B">2º B</option>
          </select>
        </div>

        <div>
          <input type="submit" value="Siguiente" />
          <input type="reset" value="Cancelar" />
        </div>
      </form>
    </main>
  </body>
</html>
